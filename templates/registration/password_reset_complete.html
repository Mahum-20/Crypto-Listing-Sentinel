{% extends 'base.html' %}

{% block title %}Password Reset Complete | CoinIntel Journal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-clean p-4 p-md-5 shadow-sm border-0 text-center">
            <i class="bi bi-shield-check text-success display-3 mb-3"></i>
            <h3 class="fw-bold text-dark">Password Reset Complete!</h3>
            <p class="text-secondary mb-4">Your password has been set. You may now sign in with your new password.</p>

            <a href="{% url 'login' %}" class="btn btn-primary-clean py-2 px-4">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
