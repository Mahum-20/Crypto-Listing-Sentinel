{% extends 'base.html' %}

{% block title %}Reset Password | CoinIntel Journal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-clean p-4 p-md-5 shadow-sm border-0">
            <div class="text-center mb-4">
                <i class="bi bi-key text-primary display-4 mb-2"></i>
                <h2 class="fw-bold text-dark">Forgot Password?</h2>
                <p class="text-secondary">Enter your email address and we'll send you instructions to reset your password.</p>
            </div>

            <form method="POST" action="{% url 'password_reset' %}">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label text-secondary fw-medium">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary-clean w-100 py-2 mb-3">
                    <i class="bi bi-envelope me-2"></i> Send Password Reset Link
                </button>
            </form>

            <div class="text-center border-top pt-3 mt-2">
                <p class="text-secondary mb-0">Remember your password? <a href="{% url 'login' %}" class="fw-semibold">Back to Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
