services:
  - type: web
    name: coinintel
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn NewCoinSetup.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: coinintel-db
          property: connectionString

databases:
  - name: coinintel-db
    databaseName: coinintel
    user: coinintel_user
